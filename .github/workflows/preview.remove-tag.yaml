name: Remove preview tag from ECR

on:
  workflow_call:
    inputs:
      APPLICATION_NAME:
        description: The name of the application
        required: true
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
jobs:
  remove-preview-tag:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ vars.AWS_ASSUME_ROLE_ARN_ECR }}
      - name: Remove preview tags from ECR
        env:
          REPOSITORY: ${{ inputs.APPLICATION_NAME }}
          PR_TAG: preview-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1; then
            echo "Repository $REPOSITORY does not exist, nothing to remove"
            exit 0
          fi
          # preview-<PR> plus every preview-<PR>-<sha>; deleting an image's last tag deletes the image
          mapfile -t TAGS < <(aws ecr list-images --repository-name "$REPOSITORY" --filter tagStatus=TAGGED \
            --query 'imageIds[].imageTag' --output text | tr '\t' '\n' | grep -E "^$PR_TAG(-|$)" || true)
          echo "Removing ${#TAGS[@]} tag(s) for $PR_TAG"
          for ((i = 0; i < ${#TAGS[@]}; i += 100)); do
            printf 'imageTag=%s\n' "${TAGS[@]:i:100}" | xargs aws ecr batch-delete-image --repository-name "$REPOSITORY" --image-ids
          done
