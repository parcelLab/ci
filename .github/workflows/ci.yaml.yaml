name: YAML
on:
  push:
    branches:
      - main
    paths:
      - "**.yml"
      - "**.yaml"
      - "!.github/workflows/*.yaml"
  pull_request:
    paths:
      - "**.yml"
      - "**.yaml"
      - "!.github/workflows/*.yaml"
  workflow_dispatch:
jobs:
  lint:
    # Lint with this repository's own copy, see ci.pr.yaml
    uses: ./.github/workflows/yaml.yaml
