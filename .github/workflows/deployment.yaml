name: Reusable Deployment
on:
  workflow_call:
    inputs:
      appName:
        required: false
        type: string
      author:
        required: true
        description: The author of the change that triggers the deployment
        type: string
      containerContext:
        required: false
        default: .
        type: string
      containerFile:
        required: false
        default: Containerfile
        type: string
      description:
        required: true
        description: The description of the change (e.g. the commit title)
        type: string
      env:
        required: true
        description: The application environment. Can be test, staging or prod.
        type: string
      namespace:
        required: false
        description: EKS namespace
        type: string
      pushToEnvTag:
        required: false
        description: Push commits to env-named tags instead of the main branch
        type: boolean
        default: false
      ref:
        required: false
        description: The github ref to deploy
        default: main
        type: string
      rebuildProduction:
        required: false
        description: Rebuild the production release recorded in .chart/prod/values.yaml to pick up base image updates
        default: false
        type: boolean
      runner:
        required: false
        description: Runner type
        default: ubuntu-latest
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
      statusUrl:
        required: false
        description: The url that shows the status of the application
        type: string
      url:
        required: false
        description: The url where the application is served
        type: string
      versionKey:
        required: false
        type: string
    secrets:
      repoAccessToken:
        required: true
        description: The Github token to perform operations cross-repo (not secrets.GITHUB_TOKEN!)
jobs:
  kubernetes:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Require production for a release rebuild
        if: inputs.rebuildProduction && inputs.env != 'prod'
        run: |
          echo "::error::rebuildProduction requires env: prod"
          exit 1
      - name: Checkout current git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuildProduction && (inputs.pushToEnvTag && 'refs/tags/prod' || 'main') || '' }}
      - name: Read current production image version
        if: inputs.rebuildProduction
        id: production-version
        uses: mikefarah/yq@v4.53.2
        with:
          cmd: yq -er '.${{ inputs.versionKey }}' .chart/prod/values.yaml
      - name: Resolve the production release to rebuild
        if: inputs.rebuildProduction
        id: rebuild
        env:
          CURRENT_VERSION: ${{ steps.production-version.outputs.result }}
        run: |
          set -euo pipefail
          # Production runs a release tag or commit SHA, or an earlier rebuild of one (rebuild-<run>.<attempt>-<release>)
          release=${CURRENT_VERSION#rebuild-*-}
          # A branch (e.g. main) would rebuild unreleased code
          if [[ ! "$release" =~ ^[0-9a-f]{40}$ ]] && ! git ls-remote --exit-code --tags origin "refs/tags/$release" >/dev/null; then
            echo "::error::Production version '$release' is neither a release tag nor a commit SHA"
            exit 1
          fi
          echo "ref=$release" >> "$GITHUB_OUTPUT"
          jq -rn --arg version "rebuild-$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT-$release" --arg replaces "$CURRENT_VERSION" \
            '"metadata=" + ({$version, $replaces} | tojson)' >> "$GITHUB_OUTPUT"
      - name: Load k8s deployment variables
        id: k8s
        run: |
          if [[ "${{ inputs.env }}" == 'prod' ]]
          then
            URL="https://${{ inputs.appName }}.parcellab.dev"
            STATUS_URL="https://argocd.${{ inputs.env }}.parcellab.dev/applications/${{ inputs.appName }}"
          else
            URL="https://${{ inputs.appName }}.${{ inputs.env }}.parcellab.dev"
            STATUS_URL="https://argocd.${{ inputs.env }}.parcellab.dev/applications/${{ inputs.appName }}"
          fi
          # shellcheck disable=SC2086
          echo "url=$URL" >> $GITHUB_OUTPUT
          # shellcheck disable=SC2086
          echo "status-url=$STATUS_URL" >> $GITHUB_OUTPUT
      - name: Create Github deployment
        uses: chrnorm/deployment-action@v2
        with:
          auto-merge: false
          environment: ${{ inputs.env }}
          ref: ${{ steps.rebuild.outputs.ref || inputs.ref }}
          required-contexts: ""
          payload: |
            {
              "author": ${{ toJSON(inputs.author) }},
              "description": ${{ toJSON(inputs.description) }},
              "env": ${{ toJSON(inputs.env) }},
              "name": "${{ inputs.appName }}",
              "container": {
                "context": "${{ inputs.containerContext }}",
                "file": "${{ inputs.Containerfile }}"
              },
              "kubernetes": {
                "namespace": "${{ inputs.namespace }}",
                "versionKey": "${{ inputs.versionKey }}"
              },
              "pushToEnvTag": "${{ inputs.pushToEnvTag }}",
              "rebuild": ${{ steps.rebuild.outputs.metadata || 'null' }},
              "statusUrl": ${{ toJSON(steps.k8s.outputs.status-url) }},
              "url": ${{ toJSON(steps.k8s.outputs.url) }}
            }
          production-environment: "${{ inputs.env == 'prod' }}"
          transient-environment: "${{ inputs.env == 'test' }}"
          token: ${{ secrets.repoAccessToken }}
