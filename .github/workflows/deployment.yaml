name: Reusable Deployment
on:
  workflow_call:
    inputs:
      appName:
        required: false
        type: string
      author:
        required: true
        description: The author of the change that triggers the deployment
        type: string
      containerContext:
        required: false
        default: .
        type: string
      containerFile:
        required: false
        default: Containerfile
        type: string
      description:
        required: true
        description: The description of the change (e.g. the commit title)
        type: string
      env:
        required: true
        description: The application environment. Can be test, staging or prod.
        type: string
      namespace:
        required: false
        description: EKS namespace
        type: string
      pushToEnvTag:
        required: false
        description: Push commits to env-named tags instead of the main branch
        type: boolean
        default: false
      ref:
        required: false
        description: The github ref to deploy
        default: main
        type: string
      rebuildProduction:
        required: false
        description: Rebuild the release recorded in .chart/prod/values.yaml from its successful deployment SHA
        default: false
        type: boolean
      runner:
        required: false
        description: Runner type
        default: ubuntu-latest
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
      statusUrl:
        required: false
        description: The url that shows the status of the application
        type: string
      url:
        required: false
        description: The url where the application is served
        type: string
      versionKey:
        required: false
        type: string
    secrets:
      repoAccessToken:
        required: true
        description: The Github token to perform operations cross-repo (not secrets.GITHUB_TOKEN!)
jobs:
  kubernetes:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Require production for a release rebuild
        if: inputs.rebuildProduction && inputs.env != 'prod'
        run: exit 1
      - name: Checkout current git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuildProduction && (inputs.pushToEnvTag && 'refs/tags/prod' || 'main') || '' }}
      - name: Read current production image version
        if: inputs.rebuildProduction
        id: production-version
        uses: mikefarah/yq@v4.53.2
        with:
          cmd: yq -er '.${{ inputs.versionKey }}' .chart/prod/values.yaml
      - name: Resolve the successful production deployment
        if: inputs.rebuildProduction
        id: rebuild
        env:
          GH_TOKEN: ${{ secrets.repoAccessToken }}
          APP_NAME: ${{ inputs.appName }}
          CURRENT_VERSION: ${{ steps.production-version.outputs.result }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=prod&per_page=100" \
            > "$RUNNER_TEMP/production-deployments.json"
          jq -c --arg app "$APP_NAME" --arg version "$CURRENT_VERSION" '
            .[] | select(.payload.name == $app) |
            select((.payload.rebuild.version // (.ref | split("/") | last)) == $version)
          ' "$RUNNER_TEMP/production-deployments.json" > "$RUNNER_TEMP/matching-deployments.jsonl"
          while IFS= read -r deployment; do
            id=$(jq -r '.id' <<< "$deployment")
            succeeded=$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
              --jq '.[] | select(.state == "success") | .id')
            if [[ -z "$succeeded" ]]; then
              continue
            fi
            source_sha=$(jq -r '.sha' <<< "$deployment")
            release=$(jq -r '.payload.rebuild.release // (.ref | split("/") | last)' <<< "$deployment")
            version="$release-rebuild-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "Invalid rebuild image tag: $version" >&2
              exit 1
            fi
            metadata=$(jq -nc --arg version "$version" --arg release "$release" \
              --arg expectedGitOpsCommit "$(git rev-parse HEAD)" \
              '{version: $version, release: $release, expectedGitOpsCommit: $expectedGitOpsCommit}')
            echo "ref=$source_sha" >> "$GITHUB_OUTPUT"
            echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
            exit 0
          done < "$RUNNER_TEMP/matching-deployments.jsonl"
          echo "No successful production deployment matches $APP_NAME:$CURRENT_VERSION" >&2
          exit 1
      - name: Load k8s deployment variables
        id: k8s
        run: |
          if [[ "${{ inputs.env }}" == 'prod' ]]
          then
            URL="https://${{ inputs.appName }}.parcellab.dev"
            STATUS_URL="https://argocd.${{ inputs.env }}.parcellab.dev/applications/${{ inputs.appName }}"
          else
            URL="https://${{ inputs.appName }}.${{ inputs.env }}.parcellab.dev"
            STATUS_URL="https://argocd.${{ inputs.env }}.parcellab.dev/applications/${{ inputs.appName }}"
          fi
          # shellcheck disable=SC2086
          echo "url=$URL" >> $GITHUB_OUTPUT
          # shellcheck disable=SC2086
          echo "status-url=$STATUS_URL" >> $GITHUB_OUTPUT
      - name: Create Github deployment
        uses: chrnorm/deployment-action@v2
        with:
          auto-merge: false
          environment: ${{ inputs.env }}
          ref: ${{ steps.rebuild.outputs.ref || inputs.ref }}
          required-contexts: ""
          payload: |
            {
              "author": ${{ toJSON(inputs.author) }},
              "description": ${{ toJSON(inputs.description) }},
              "env": ${{ toJSON(inputs.env) }},
              "name": "${{ inputs.appName }}",
              "container": {
                "context": "${{ inputs.containerContext }}",
                "file": "${{ inputs.Containerfile }}"
              },
              "kubernetes": {
                "namespace": "${{ inputs.namespace }}",
                "versionKey": "${{ inputs.versionKey }}"
              },
              "pushToEnvTag": "${{ inputs.pushToEnvTag }}",
              "rebuild": ${{ steps.rebuild.outputs.metadata || 'null' }},
              "statusUrl": ${{ toJSON(steps.k8s.outputs.status-url) }},
              "url": ${{ toJSON(steps.k8s.outputs.url) }}
            }
          production-environment: "${{ inputs.env == 'prod' }}"
          transient-environment: "${{ inputs.env == 'test' }}"
          token: ${{ secrets.repoAccessToken }}
