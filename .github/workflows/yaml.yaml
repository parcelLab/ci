name: Reusable YAML
on:
  workflow_call:
    inputs:
      runner:
        required: false
        description: Runner type
        default: ubuntu-latest
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
      additional_args:
        required: false
        description: List of yaml files to exclude
        type: string
jobs:
  yaml:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Checkout current git repository
        uses: actions/checkout@v7

      - name: Set up node environment
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Lint YAML files
        # npx, not npm ci: calling repositories may have no package.json.
        env:
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
        run: |
          # Split additional_args into words, but leave the globs for Prettier
          # to interpret rather than letting bash expand them against the repo.
          set -f
          # shellcheck disable=SC2086
          npx --yes prettier@3.9.6 --check -- "**/*.{yaml,yml}" $ADDITIONAL_ARGS
