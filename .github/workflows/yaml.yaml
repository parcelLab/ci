name: Reusable YAML
on:
  workflow_call:
    inputs:
      runner:
        required: false
        description: Runner type
        default: ubuntu-latest
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
      additional_args:
        required: false
        description: List of yaml files to exclude
        type: string
jobs:
  yaml:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Checkout current git repository
        uses: actions/checkout@v7

      - name: Lint YAML files
        # Run prettier via npx: calling repos are not necessarily Node
        # projects, so this must not depend on a package.json being present.
        env:
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
        run: npx --yes prettier@3.9.6 --check "**/*.{yaml,yml}" $ADDITIONAL_ARGS
