name: Reusable YAML
on:
  workflow_call:
    inputs:
      runner:
        required: false
        description: Runner type
        default: ubuntu-latest
        type: string
      timeoutMinutes:
        required: false
        description: Maximum minutes before the job is cancelled
        default: 40
        type: number
      additional_args:
        required: false
        description: List of yaml files to exclude
        type: string
jobs:
  yaml:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeoutMinutes }}
    steps:
      - name: Checkout current git repository
        uses: actions/checkout@v7

      - name: Lint YAML files
        # npx, not npm ci: calling repositories may have no package.json.
        env:
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
        run: |
          # shellcheck disable=SC2086  # additional_args is a list of globs, so word splitting is intended
          npx --yes prettier@3.9.6 --check "**/*.{yaml,yml}" $ADDITIONAL_ARGS
